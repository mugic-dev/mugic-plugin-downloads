<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MUGIC MOTION — Plugin Downloads</title>
<meta name="description" content="Download the MUGIC MOTION plugin for macOS and Windows — Audio Unit, VST3 and standalone.">
<style>
  :root {
    --bg:#f7f7f5; --card:#ffffff; --fg:#17181c; --muted:#5f6470;
    --line:#e3e4e8; --accent:#1f6feb; --accent-fg:#ffffff; --soft:#f0f1f4;
  }
  :root:not([data-theme="light"]) { }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg:#14151a; --card:#1c1e25; --fg:#e9eaee; --muted:#9ba1ae;
      --line:#2b2e37; --accent:#5b9dff; --accent-fg:#0b0d12; --soft:#23262f;
    }
  }
  :root[data-theme="dark"] {
    --bg:#14151a; --card:#1c1e25; --fg:#e9eaee; --muted:#9ba1ae;
    --line:#2b2e37; --accent:#5b9dff; --accent-fg:#0b0d12; --soft:#23262f;
  }
  * { box-sizing:border-box; }
  body {
    margin:0; background:var(--bg); color:var(--fg);
    font:16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .wrap { max-width:820px; margin:0 auto; padding:48px 20px 80px; }
  header { margin-bottom:40px; }
  h1 { font-size:1.9rem; margin:0 0 6px; letter-spacing:-0.02em; }
  h1 .reg { font-size:0.6em; vertical-align:super; }
  .tag { color:var(--muted); margin:0; }
  .card {
    background:var(--card); border:1px solid var(--line); border-radius:14px;
    padding:26px; margin-bottom:22px;
  }
  .latest-head { display:flex; flex-wrap:wrap; align-items:baseline; gap:10px; margin-bottom:4px; }
  .ver { font-size:1.5rem; font-weight:650; letter-spacing:-0.01em; }
  .pill {
    font-size:0.72rem; font-weight:600; letter-spacing:0.04em; text-transform:uppercase;
    background:var(--accent); color:var(--accent-fg); padding:3px 9px; border-radius:999px;
  }
  .date { color:var(--muted); font-size:0.9rem; }
  .dl { display:flex; flex-wrap:wrap; gap:12px; margin:22px 0 8px; }
  .btn {
    flex:1 1 240px; display:block; text-decoration:none; text-align:center;
    background:var(--accent); color:var(--accent-fg); font-weight:600;
    padding:14px 18px; border-radius:10px; transition:opacity .15s;
  }
  .btn:hover { opacity:.88; }
  .btn small { display:block; font-weight:400; opacity:.8; font-size:0.78rem; margin-top:3px; }
  .guides { display:flex; flex-wrap:wrap; gap:12px; margin-top:12px; }
  .btn2 {
    flex:1 1 240px; display:block; text-decoration:none; text-align:center;
    border:1.5px solid var(--accent); color:var(--accent); font-weight:600;
    padding:12px 18px; border-radius:10px; background:transparent;
    transition:background .15s, color .15s;
  }
  .btn2:hover { background:var(--accent); color:var(--accent-fg); }
  .req { color:var(--muted); font-size:0.86rem; margin:18px 0 0; text-align:center; }
  .notes { margin-top:20px; padding-top:18px; border-top:1px solid var(--line); }
  .notes h3 { font-size:0.8rem; text-transform:uppercase; letter-spacing:0.06em; color:var(--muted); margin:0 0 10px; }
  .notes ul { margin:0; padding-left:20px; }
  .notes li { margin-bottom:5px; }
  .notes p { margin:0 0 10px; }
  h2 { font-size:1.05rem; margin:38px 0 14px; letter-spacing:-0.01em; }
  .old { padding:18px 22px; }
  .old .row { display:flex; flex-wrap:wrap; align-items:baseline; gap:10px; }
  .old .ver { font-size:1.05rem; }
  .old .links { margin-left:auto; display:flex; gap:14px; }
  .old .links a { color:var(--accent); text-decoration:none; font-size:0.9rem; font-weight:500; }
  .old .links a:hover { text-decoration:underline; }
  .old .notes { margin-top:14px; padding-top:12px; font-size:0.93rem; }
  footer { margin-top:44px; color:var(--muted); font-size:0.85rem; text-align:center; }
  footer a { color:var(--muted); }
  .msg { color:var(--muted); }
  code { background:var(--soft); padding:1px 5px; border-radius:5px; font-size:0.88em; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>MUGIC MOTION<span class="reg">®</span> Plugin</h1>
    <p class="tag">Audio Unit, VST3 and standalone — turn MUGIC motion into MIDI.</p>
  </header>

  <div id="latest"><p class="msg">Loading downloads…</p></div>
  <div id="older"></div>

  <footer>
    Having trouble? Each download has an install guide beside it.<br>
    <a href="https://mugic-motion.gitbook.io/mugic-r-documentation/getting-started-hub/getting-started">MUGIC documentation</a>
  </footer>
</div>

<script>
(function () {
  var REPO = 'https://github.com/mugic-dev/mugic-plugin-downloads';

  // Minimal markdown: paragraphs, "- " bullets, **bold**, `code`.
  function esc(s) {
    return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }
  function inline(s) {
    return esc(s)
      .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
      .replace(/`([^`]+)`/g, '<code>$1</code>');
  }
  function md(text) {
    if (!text) return '';
    var out = '', list = [];
    function flush() {
      if (list.length) { out += '<ul>' + list.map(function (i) { return '<li>' + inline(i) + '</li>'; }).join('') + '</ul>'; list = []; }
    }
    text.split(/\r?\n/).forEach(function (line) {
      var t = line.trim();
      if (!t) { flush(); return; }
      if (/^[-*]\s+/.test(t)) { list.push(t.replace(/^[-*]\s+/, '')); return; }
      flush();
      out += '<p>' + inline(t) + '</p>';
    });
    flush();
    return out;
  }

  function fmtDate(d) {
    if (!d) return '';
    var dt = new Date(d + 'T00:00:00Z');
    if (isNaN(dt)) return d;
    return dt.toLocaleDateString(undefined, { year: 'numeric', month: 'long', day: 'numeric', timeZone: 'UTC' });
  }

  // Published versions link to a rendered guide page; entries written before those
  // existed fall back to the .md asset so older rows keep working.
  function guide(v, platform) {
    if (platform === 'macos')   return v.macosGuide   || v.macosReadme   || '';
    if (platform === 'windows') return v.windowsGuide || v.windowsReadme || '';
    return '';
  }

  function renderLatest(v) {
    return '' +
      '<div class="card">' +
        '<div class="latest-head">' +
          '<span class="ver">Version ' + esc(v.version) + '</span>' +
          '<span class="pill">Latest</span>' +
          '<span class="date">' + esc(fmtDate(v.date)) + '</span>' +
        '</div>' +
        '<div class="dl">' +
          (v.macos ? '<a class="btn" href="' + esc(v.macos) + '">Download for macOS<small>Universal installer · Intel &amp; Apple Silicon</small></a>' : '') +
          (v.windows ? '<a class="btn" href="' + esc(v.windows) + '">Download for Windows<small>64-bit · VST3 &amp; standalone</small></a>' : '') +
        '</div>' +
        '<div class="guides">' +
          (guide(v, 'macos')   ? '<a class="btn2" href="' + esc(guide(v, 'macos'))   + '">macOS install guide</a>' : '') +
          (guide(v, 'windows') ? '<a class="btn2" href="' + esc(guide(v, 'windows')) + '">Windows install guide</a>' : '') +
        '</div>' +
        '<p class="req">macOS 11 Big Sur or later · Windows 10 / 11 64-bit</p>' +
        (v.notes ? '<div class="notes"><h3>What’s new</h3>' + md(v.notes) + '</div>' : '') +
      '</div>';
  }

  function renderOld(v) {
    return '' +
      '<div class="card old">' +
        '<div class="row">' +
          '<span class="ver">' + esc(v.version) + '</span>' +
          '<span class="date">' + esc(fmtDate(v.date)) + '</span>' +
          '<span class="links">' +
            (v.macos ? '<a href="' + esc(v.macos) + '">macOS</a>' : '') +
            (guide(v, 'macos') ? '<a href="' + esc(guide(v, 'macos')) + '">guide</a>' : '') +
            (v.windows ? '<a href="' + esc(v.windows) + '">Windows</a>' : '') +
            (guide(v, 'windows') ? '<a href="' + esc(guide(v, 'windows')) + '">guide</a>' : '') +
          '</span>' +
        '</div>' +
        (v.notes ? '<div class="notes">' + md(v.notes) + '</div>' : '') +
      '</div>';
  }

  fetch('versions.json?' + Date.now())
    .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
    .then(function (data) {
      var list = (data.versions || []).slice();
      if (!list.length) throw new Error('empty');
      document.getElementById('latest').innerHTML = renderLatest(list[0]);
      if (list.length > 1) {
        document.getElementById('older').innerHTML =
          '<h2>Previous versions</h2>' + list.slice(1).map(renderOld).join('');
      }
    })
    .catch(function () {
      document.getElementById('latest').innerHTML =
        '<div class="card"><p class="msg">Couldn’t load the version list. ' +
        'All downloads are available on the <a href="' + REPO + '/releases">releases page</a>.</p></div>';
    });
})();
</script>
</body>
</html>
